<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout page</title>
    <link rel="stylesheet" href="restaurant.css">
</head>
<body>
    <main class="page">
        <div class="header-band compact">
            <a href="index.html"><h1>Student Pot</h1></a>
            <h2>Checkout</h2>
        </div>

        <h3 class="section-title">Your order</h3>
        <div class="card table-wrap">
            <table class="order-table">
                <thead>
                    <tr>
                        <th>Items Name</th>
                        <th>Description</th>
                        <th>Quantity</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>The Jollof Pot</td>
                        <td>Morning dish</td>
                        <td>1</td>
                        <td>&#8358;2000</td>
                    </tr>
                    <tr>
                        <td>Custom Request Pot</td>
                        <td>A pot of egusi &amp; A pot of stew</td>
                        <td>2</td>
                        <td>&#8358;5000</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h3 class="section-title">Delivery Details</h3>
        <form class="card" action="tracker.html" method="get">
            <div class="field">
                <label for="student-name">Your Full Name:</label>
                <input type="text" id="student-name" name="name" required placeholder="e.g. Adeyemi Tutu">
            </div>
            <div class="field">
                <label for="student-phone">Whatsapp/Phone number:</label>
                <input type="tel" id="student-phone" name="phone" required placeholder="e.g. 08148163314">
            </div>
            <div class="field">
                <label for="hostel-address">Hostel Name</label>
                <input type="text" id="hostel-address" name="hostel" required placeholder="e.g. Queens hall">
            </div>
            <div class="field">
                <label for="cooking-notes">Special Delivery or Cooking Instructions:</label>
                <textarea id="cooking-notes" name="notes" rows="4" placeholder="e.g. No onions and make it spicy, deliver before 2PM"></textarea>
            </div>
            <button class="btn" type="submit">Confirm Order &amp; Track Delivery</button>
        </form>
    </main>
</body>
</html>
