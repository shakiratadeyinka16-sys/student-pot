<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker page</title>
</head>
<body>
    <h1>Track Your Student Pot</h1>
    <p>Thank you for your order! Your food is being prepared with love. </p>
    <hr>
<h2>Order Status</h2>

<ol style="font-size: 18px; line-height: 2;">
    <!--Step 1: Completed Status (green text)-->
    <li style="color: green; font-weight: bold;"> Order Received & Confimed</li>

    <!--Step 2: Current active status (bolded/highlighted text)-->
    <li style="color: orange; font-weight: bold;">Kitchen is cooking your Pot....</li>

    <!--Step 3: Upcoming status(faded gray text)-->
    <li style="color: gray;">Out for delivery to your Hostel</li>

    <!--Step 4: Upcoming status(faded gray text)-->
    <li style="color: gray;">Arrived at your Door</li>
</ol>

<hr>
<p><strong>Estimated Waiting Time:</strong> 30-45 minutes</p>
    
</body>
</html>
