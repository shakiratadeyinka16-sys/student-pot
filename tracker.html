<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker page</title>
    <link rel="stylesheet" href="restaurant.css">
</head>
<body>
    <main class="page">
        <div class="header-band compact">
            <a href="index.html"><h1>Student Pot</h1></a>
            <h2>Track Your Student Pot</h2>
        </div>

        <div class="card">
            <p>Thank you for your order! Your food is being prepared with love.</p>
        </div>

        <h3 class="section-title">Order Status</h3>
        <div class="card">
            <ol class="timeline">
                <!-- done = green tick, current = pulsing gold, no class = upcoming -->
                <li class="done">Order Received &amp; Confirmed</li>
                <li class="current">Kitchen is cooking your pot&hellip;</li>
                <li>Out for delivery to your Hostel</li>
                <li>Arrived at your Door</li>
            </ol>
        </div>

        <div class="card eta">
            <span class="note">Estimated Waiting Time</span>
            <strong>30-45 minutes</strong>
        </div>

        <a class="btn" href="index.html">Back to home</a>
    </main>
</body>
</html>
